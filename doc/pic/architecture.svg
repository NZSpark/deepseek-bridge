<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">DeepSeek Web-to-API Bridge 系统架构</title><desc id="desc">展示客户端、OpenAI 兼容 API、会话路由、Playwright 浏览器与 DeepSeek 网页之间的关系。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5276ad"/></marker><marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#19866a"/></marker></defs><rect width="1200" height="690" rx="22" fill="#f5f8fd"/><text x="48" y="55" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#172b4d">DeepSeek Web-to-API Bridge</text><text x="49" y="83" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#62738b">系统架构 · 用本地 OpenAI 兼容接口驱动真实的 DeepSeek 网页会话</text><rect x="40" y="125" width="205" height="365" rx="16" fill="#ffffff" stroke="#d5dfed" stroke-width="2"/><rect x="40" y="125" width="205" height="48" rx="16" fill="#e6efff"/><path d="M40 157 V173 H245 V157" fill="#e6efff"/><text x="142" y="155" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#244f91">客户端</text><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#253b59"><rect x="58" y="195" width="169" height="48" rx="9" fill="#f5f8fd" stroke="#d8e2f0"/><text x="142" y="224" text-anchor="middle">Pi Coding Agent</text><rect x="58" y="255" width="169" height="48" rx="9" fill="#f5f8fd" stroke="#d8e2f0"/><text x="142" y="284" text-anchor="middle">Codex CLI</text><rect x="58" y="315" width="169" height="48" rx="9" fill="#f5f8fd" stroke="#d8e2f0"/><text x="142" y="344" text-anchor="middle">OpenAI SDK</text><rect x="58" y="375" width="169" height="48" rx="9" fill="#f5f8fd" stroke="#d8e2f0"/><text x="142" y="404" text-anchor="middle">LangChain / Cline</text><text x="142" y="458" text-anchor="middle" font-size="13" fill="#62738b">HTTP + JSON / SSE</text></g><rect x="285" y="110" width="560" height="400" rx="18" fill="#ffffff" stroke="#8ba8d6" stroke-width="2"/><rect x="285" y="110" width="560" height="52" rx="18" fill="#dce9ff"/><path d="M285 145 V162 H845 V145" fill="#dce9ff"/><text x="565" y="143" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#244f91">本地 API 服务 · FastAPI</text><rect x="310" y="182" width="510" height="65" rx="11" fill="#edf4ff" stroke="#c9d9f1"/><text x="565" y="207" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#244f91">协议入口</text><text x="565" y="229" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#45658f">/v1/models · /v1/chat/completions · /v1/responses</text><path d="M565 247 V265" stroke="#5276ad" stroke-width="2" marker-end="url(#arrow)"/><rect x="310" y="270" width="245" height="83" rx="11" fill="#f3efff" stroke="#d8ccfa"/><text x="432" y="295" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#6445a5">会话路由与状态</text><text x="432" y="317" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#645a80">任务分桶 · 会话绑定</text><text x="432" y="337" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#645a80">轮数 / token 估算 / 播种</text><rect x="570" y="270" width="250" height="83" rx="11" fill="#e8f7f1" stroke="#b8e2d3"/><text x="695" y="295" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#176d56">请求编排</text><text x="695" y="317" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3