ffffff" stroke="#d5dfed"/><text x="970" y="617" text-anchor="middle">不需要 DeepSeek 官方 API Key</text></g><text x="600" y="665" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8492a6">示意图依据 README 所述架构；网页自动化依赖上游页面结构与有效登录态。</text></svg>