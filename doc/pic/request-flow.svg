<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="910" viewBox="0 0 1100 910" role="img" aria-labelledby="title desc"><title id="title">API 请求处理流程</title><desc id="desc">从客户端发起请求，经协议入口、会话桶路由、浏览器页面操作、回复完成判定到 OpenAI 兼容响应。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5579ae"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16846a"/></marker></defs><rect width="1100" height="910" rx="24" fill="#f5f8fd"/><text x="50" y="52" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#172b4d">一次 API 请求如何完成</text><text x="50" y="80" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#62738b">请求路由、网页自动化、结束判定与兼容响应</text><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle"><rect x="285" y="112" width="530" height="66" rx="12" fill="#e5efff" stroke="#a9c2e9" stroke-width="1.5"/><text x="550" y="139" font-size="17" font-weight="700" fill="#244f91">1 · 接收 HTTP 请求</text><text x="550" y="160" font-size="13" fill="#45658f">校验 messages / input，识别 stream 与 tools</text><path d="M550 178 V207" stroke="#5579ae" stroke-width="2.5" marker-end="url(#a)"/><rect x="285" y="212" width="530" height="72" rx="12" fill="#f0ebff" stroke="#c9b8f5" stroke-width="1.5"/><text x="550" y="239" font-size="17" font-weight="700" fill="#6445a5">2 · 确定会话桶</text><text x="550" y="261" font-size="13" fill="#645a80">显式请求头 / user → 工作目录 → User-Agent → 默认桶</text><path d="M550 284 V313" stroke="#5579ae" stroke-width="2.5" marker-end="url(#a)"/><rect x="285" y="318" width="530" height="72" rx="12" fill="#fff4e2" stroke="#efd19d" stroke-width="1.5"/><text x="550" y="345" font-size="17" font-weight="700" fill="#875519">3 · 获取或恢复页面</text><text x="550" y="367" font-size="13" fill="#8a6a3f">页面池判活 / 重建；必要时打开原会话并播种历史</text><path d="M550 390 V419" stroke="#5579ae" stroke-width="2.5" marker-end="url(#a)"/><rect x="285" y="424" width="530" height="72" rx="12" fill="#e4f6ee" stroke="#a7ddc8" stroke-width="1.5"/><text x="550" y="451" font-size="17" font-weight="700" fill="#176d56">4 · 构造 prompt 并提交到网页</text><text x="550" y="473" font-size="13" fill="#3e7768">仅发送所需增量；等待 DeepSeek 生成内容</text><path d="M550 496 V525" stroke="#5579ae" stroke-width="2.5" marker-end="url(#a)"/><polygon points="550,529 690,584 550,639 410,584" fill="#ffffff" stroke="#91a9cc" stroke-width="2"/><text x="550" y="579" font-size="16" font-weight="700" fill="#244f91">5 · 回复是否完成？</text><text x="550" y="600" font-size="13" fill="#62738b">结合生成状态与文本稳定性判断</text><path d="M410 584 H190 V662" stroke="#5579ae" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="285" y="571" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5579ae">否</text><rect x="48" y="667" width="284" height="72" rx="12" fill="#fff4e2" stroke="#efd19d" stroke-width="1.5"/><text x="190" y="694" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#875519">继续等待 / 恢复重试</text><text x="190" y="716" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8a6a3f">超时、页面失效等按策略处理</text><path d="M190 667 V460 H285" stroke="#5579ae" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a)"/><text x="205" y="449" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5579ae">恢复后重试</text><path d="M690 584 H905 V662" stroke="#16846a" stroke-width="2.5" fill="none" marker-end="url(#g)"/><text x="765" y="571" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#16846a">是</text><rect x="765" y="667" width="287" height="72" rx="12" fill="#e4f6ee" stroke="#a7ddc8" stroke-width="1.5"/><text x="908" y="694" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#176d56">6 · 编码并返回客户端</text><text x="908" y="716" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3e7768">JSON 或 SSE；工具调用先完成解析</text><path d="M908 739 V770 H550 V793" stroke="#16846a" stroke-width="2.5" fill="none" marker-end="url(#g)"/><rect x="285" y="798" width="530" height="62" rx="12" fill="#ffffff" stroke="#cdd8e8" stroke-width="1.5"/><text x="550" y="823" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#253b59">可观测性与运维</text><text x="550" y="844" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#62738b">/healthz · /bridge status · 可选 /debug/dom（调试模式）</text></g><text x="550" y="889" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8492a6">具体重试范围与超时以 deepseek_web/config.py 和设计文档为准。</text></svg>