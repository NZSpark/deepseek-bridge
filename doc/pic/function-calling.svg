<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc"><title id="title">模拟 Function Calling 流程</title><desc id="desc">客户端提供工具定义，桥接层把工具定义注入提示词，解析模型返回的调用，坏结构时在同一会话重试，客户端执行工具后把结果通过 role tool 回填。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5579ae"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16846a"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c1812c"/></marker></defs><rect width="1100" height="850" rx="24" fill="#f5f8fd"/><text x="48" y="52" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#172b4d">模拟 Function Calling：从工具定义到执行结果</text><text x="49" y="80" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#62738b">网页模型输出结构化文本；桥接层负责解析，实际工具由客户端执行</text><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle"><rect x="55" y="122" width="270" height="82" rx="13" fill="#e5efff" stroke="#a9c2e9" stroke-width="1.5"/><text x="190" y="151" font-size="17" font-weight="700" fill="#244f91">1 · 客户端提交</text><text x="190" y="174" font-size="13" fill="#45658f">messages + tools + tool_choice</text><text x="190" y="192" font-size="12" fill="#45658f">例如 search / read / bash</text><path d="M325 163 H390" fill="none" stroke="#5579ae" stroke-width="2.5" marker-end="url(#a)"/><rect x="395" y="122" width="310" height="82" rx="13" fill="#f0ebff" stroke="#c9b8f5" stroke-width="1.5"/><text x="550" y="151" font-size="17" font-weight="700" fill="#6445a5">2 · 注入工具说明</text><text x="550" y="174" font-size="13" fill="#645a80">format_tools_instruction</text><text x="550" y="192" font-size="12" fill="#645a80">转成提示词，要求输出 tool_call</text><path d="M550 204 V235" fill="none" stroke="#5579ae" stroke-width="2.5" marker-end="url(#a)"/><rect x="395" y="240" width="310" height="82" rx="13" fill="#fff4e2" stroke="#efd19d" stroke-width="1.5"/><text x="550" y="269" font-size="17" font-weight="700" fill="#875519">3 · 网页模型生成</text><text x="550" y="292" font-size="13" fill="#8a6a3f">返回普通文本或 tool_call + JSON</text><text x="550" y="310" font-size="12" fill="#8a6a3f">从 DeepSeek DOM 提取回复</text><path d="M550 322 V353" fill="none" stroke="#5579ae" stroke-width="2.5" marker-end="url(#a)"/><polygon points="550,357 680,407 550,457 420,407" fill="#ffffff" stroke="#91a9cc" stroke-width="2"/><text x="550" y="402" font-size="16" font-weight="700" fill="#244f91">4 · 解析结构合法？</text><text x="550" y="423" font-size="13" fill="#62738b">合法工具名 / JSON / 参数结构</text><path d="M420 407 H190 V483" fill="none" stroke="#c1812c" stroke-width="2.5" marker-end="url(#o)"/><text x="284" y="394" font-size="13" fill="#a16a25">否</text><rect x="48" y="488" width="284" height="84" rx="13" fill="#fff4e2" stroke="#efd19d" stroke-width="1.5"/><text x="190" y="516" font-size="16" font-weight="700" fill="#875519">坏结构重试</text><text x="190" y="539" font-size="13" fill="#8a6a3f">空围栏 / JSON 截断 / 语法错</text><text x="190" y="557" font-size="12" fill="#8a6a3f">同一网页会话提示重发；次数可配置</text><path d="M190 488 V280 H390" fill="none" stroke="#c1812c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#o)"/><text x="204" y="470" font-size="12" fill="#a16a25">重试未耗尽</text><path d="M680 407 H850 V483" fill="none" stroke="#16846a" stroke-width="2.5" marker-end="url(#g)"/><text x="762" y="394" font-size="13" fill="#16846a">是</text><rect x="710" y="488" width="340" height="84" rx="13" fill="#e4f6ee" stroke="#a7ddc8" stroke-width="1.5"/><text x="880" y="516" font-size="16" font-weight="700" fill="#176d56">5 · 返回工具调用</text><text x="880" y="539" font-size="13" fill="#3e7768">OpenAI tool_calls / function_call</text><text x="880" y="557" font-size="12" fill="#3e7768">包含工具名称与 JSON 参数</text><path d="M880 572 V604" fill="none" stroke="#16846a" stroke-width="2.5" marker-end="url(#g)"/><rect x="710" y="609" width="340" height="78" rx="13" fill="#e5efff" stroke="#a9c2e9" stroke-width="1.5"/><text x="880" y="637" font-size="16" font-weight="700" fill="#244f91">6 · 客户端执行工具</text><text x="880" y="660" font-size="13" fill="#45658f">桥接服务只描述 / 解析调用，不执行工具</text><path d="M710 648 H550 V700" fill="none" stroke="#16846a" stroke-width="2.5" marker-end="url(#g)"/><rect x="395" y="705" width="310" height="78" rx="13" fill="#f0ebff" stroke="#c9b8f5" stroke-width="1.5"/><text x="550" y="733" font-size="16" font-weight="700" fill="#6445a5">7 · 回填 role: tool 结果</text><text x="550" y="756" font-size="13" fill="#645a80">下一轮 prompt 带上工具执行结果</text><path d="M395 744 H350 V280 H390" fill="none" stroke="#5579ae" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="337" y="669" font-size="12" fill="#5579ae" transform="rotate(-90 337 669)">继续对话，直到得到最终回答</text><text x="550" y="820" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8492a6">对应实现：deepseek_web/toolcalls.py · malformed.py · toolcall_retry.py；细节见 doc/toolcall_retry.md</text></g></svg>